# Application name (must match config file name on config server)
spring.application.name=jpa-service

# Config Server connection (new style for Spring Cloud 2022+)
spring.config.import=optional:configserver:http://localhost:8888

# Config Server credentials (if secured)
spring.cloud.config.username=configuser
spring.cloud.config.password=configpass

# Eureka configuration
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/
eureka.instance.preferIpAddress=true

# Database configuration
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate properties
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Server port
server.port=8081